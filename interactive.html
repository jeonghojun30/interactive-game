<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>인터랙티브 시네마 | Interactive Story</title>
  <meta name="description" content="선택에 따라 결말이 달라지는 넷플릭스 밴더스내치 스타일의 인터랙티브 비디오 웹 플레이어">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/interactive.css">
</head>

<body>

  <div class="player-wrapper">
    <!-- 비디오 뷰포트 레이어 -->
    <div class="video-stage">
      <!-- 듀얼 비디오 태그 (부드러운 크로스페이드 및 전환) -->
      <video id="videoA" class="video-layer active" playsinline preload="auto"></video>
      <video id="videoB" class="video-layer" playsinline preload="auto"></video>

      <!-- 실제 영상 파일이 없을 때 즉시 동작하는 시네마틱 캔버스 시뮬레이터 -->
      <canvas id="simulatorCanvas"></canvas>

      <!-- 시네마틱 비네트 & 선택지 딤 레이어 -->
      <div class="cinematic-vignette"></div>
      <div id="choiceDimmer" class="choice-dimmer"></div>
    </div>

    <!-- 영상 재생 바 -->
    <div class="video-progress-container">
      <div id="videoProgressFill" class="video-progress-fill"></div>
    </div>

    <!-- 상단 글로벌 HUD -->
    <header class="top-hud">
      <div class="scene-indicator">
        <div class="pulse-dot"></div>
        <span id="sceneIndicatorText" class="scene-title">준비 중...</span>
      </div>

      <div class="hud-actions">
        <button id="timerToggleBtn" class="hud-btn" title="선택지 제한시간 카운트다운">
          <span>⏳</span> 선택 타이머
        </button>
        <button id="modeToggleBtn" class="hud-btn" title="실제 영상 파일 / 가상 데모 전환">
          <span>🎬</span> 모드 전환
        </button>
        <button id="mapBtn" class="hud-btn" title="전체 스토리 분기 트리 보기 (단축키: M)">
          <span>🗺️</span> 스토리 맵
        </button>
        <button id="fullscreenBtn" class="hud-btn" title="전체화면 (단축키: F)">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- 하단 선택지 영역 (Black Mirror Bandersnatch HUD) -->
    <section id="choicesOverlay" class="choices-overlay" aria-label="선택지 오버레이">
      <div class="choice-prompt-header">
        <div class="prompt-badge">DECISION POINT</div>
        <h2 id="choicePromptTitle" class="choice-heading">다음 행동을 선택하십시오</h2>
      </div>

      <!-- 타이머 프로그레스 바 -->
      <div id="decisionTimerBar" class="decision-timer-bar">
        <div id="decisionTimerFill" class="decision-timer-fill"></div>
      </div>

      <!-- 선택지 버튼 그리드 -->
      <div id="choicesGrid" class="choices-grid">
        <!-- JS로 동적 생성 -->
      </div>
    </section>

    <!-- 시작 인트로 오버레이 -->
    <div id="introOverlay" class="intro-overlay">
      <div class="intro-logo">Interactive Experience</div>
      <h1 class="intro-title">블랙미러 인터랙티브 스토리</h1>
      <p class="intro-desc">
        영상 종료 시 마지막 장면에 자연스럽게 멈춘 후 하단에 선택지가 제시됩니다.<br>
        선택에 따라 다음 사건이 전개되거나 이전 선택지로 되돌아갈 수 있습니다.
      </p>

      <button id="startExperienceBtn" class="start-btn">
        <span>▶</span> 인터랙티브 시작하기
      </button>

      <div class="video-mode-indicator">
        <span id="videoModeStatus">📁 videos/ 폴더의 영상 파일(1.mp4 ~ 11.mp4)과 자동 연동됩니다.</span>
      </div>
    </div>

    <!-- 스토리 분기 맵 모달 -->
    <div id="mapModal" class="modal-overlay">
      <div class="map-modal-card">
        <div class="modal-header">
          <h3 class="modal-title">🧭 전체 분기 맵 (Story Navigation)</h3>
          <button id="closeMapBtn" class="close-btn" aria-label="닫기">✕</button>
        </div>
        <div id="flowDiagramArea" class="map-content-area">
          <!-- JS로 동적 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toastMsg" class="toast-msg"></div>
  </div>

  <script src="js/interactive.js"></script>
</body>

</html>
